<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicklePro Tournament - Live Courts, Matches & Standings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #080d1a;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
    }
    .font-display { font-family: 'Chakra Petch', sans-serif; }
    .neon-lime { color: #ccff00; }
    .bg-neon-lime { background-color: #ccff00; }
    .border-neon-lime { border-color: #ccff00; }
    .card-bg { background-color: #0f172a; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  
    /* ===== GLASS UI + PADDLE BG + FIRE ===== */
    body{background:radial-gradient(1200px 700px at 15% 10%,#12304f 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#3b1457 0%,transparent 60%),#060a16;}
    #paddleBg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
    #paddleBg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,22,.45),rgba(6,10,22,.7))}
    .paddle{position:absolute;width:clamp(80px,11vw,170px);opacity:.8;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));animation:floaty var(--d) ease-in-out var(--dl) infinite alternate}
    .paddle svg{width:100%;height:auto;display:block}
    @keyframes floaty{from{transform:translateY(-14px) rotate(var(--r))}to{transform:translateY(16px) rotate(calc(var(--r) + 6deg))}}
    .glass-panel,header,.bg-slate-900,.bg-slate-800,.bg-slate-900\/90,.bg-slate-900\/60,.bg-slate-900\/40{
      background:rgba(255,255,255,.07)!important;backdrop-filter:blur(20px) saturate(170%)!important;-webkit-backdrop-filter:blur(20px) saturate(170%)!important;
      border-color:rgba(255,255,255,.16)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 32px rgba(0,0,0,.35)}
    .hover\:bg-slate-700:hover{background:rgba(255,255,255,.16)!important}
    input,select,textarea{background:rgba(255,255,255,.08)!important;backdrop-filter:blur(10px);border-color:rgba(255,255,255,.2)!important;color:#fff}
    option{background:#0f172a;color:#fff}
    .border-slate-800,.border-slate-700,.border-slate-800\/80{border-color:rgba(255,255,255,.14)!important}
    .bg-neon-lime{box-shadow:0 0 18px rgba(204,255,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
    #scoreModal{background:rgba(3,6,15,.55)!important}
    .powered{position:relative;margin:1.2rem auto 1rem;display:flex;align-items:center;gap:.35rem;padding:.3rem .8rem;border-radius:999px;
      background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,140,0,.45);animation:glow 1.6s ease-in-out infinite alternate}
    @keyframes glow{from{box-shadow:0 0 14px rgba(255,100,0,.3)}to{box-shadow:0 0 34px rgba(255,160,0,.65)}}
    .powered small{font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:#cbd5e1}
    .fire-text{position:relative;font:800 .95rem 'Chakra Petch',sans-serif;color:#fff3b0;letter-spacing:.04em;
      text-shadow:0 -1px 3px #fff,0 -3px 8px #ffe14d,0 -6px 14px #ff9500,0 -10px 22px #ff4500,0 -16px 34px #d10000;animation:flicker .9s infinite alternate}
    @keyframes flicker{0%{text-shadow:0 -1px 3px #fff,0 -3px 8px #ffe14d,0 -6px 14px #ff9500,0 -10px 22px #ff4500,0 -16px 34px #d10000}
      50%{text-shadow:0 -2px 4px #fff,0 -5px 10px #ffd000,0 -9px 18px #ff7a00,0 -14px 28px #ff3000,0 -22px 40px #b00}
      100%{text-shadow:0 -1px 3px #fff,0 -4px 9px #ffe14d,0 -7px 16px #ff8800,0 -12px 26px #ff3d00,0 -18px 38px #c00}}
    .flame{display:inline-block;font-size:.75rem;animation:dance .5s ease-in-out infinite alternate;transform-origin:50% 100%}
    @keyframes dance{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.25,1.4) rotate(6deg)}}
    .ember{position:absolute;bottom:60%;width:4px;height:4px;border-radius:50%;background:#ffb300;box-shadow:0 0 8px #ff6a00;opacity:0;animation:rise 1.8s linear infinite}
    @keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-46px) translateX(var(--x)) scale(.2);opacity:0}}
    @media (prefers-reduced-motion:reduce){.paddle,.fire-text,.flame,.ember,.powered{animation:none}}
      select,input,textarea{border:1px solid rgba(255,255,255,.2)}
    nav button{padding:.7rem 0;border-radius:.9rem;color:#cbd5e1}
    nav button.on{color:#ccff00;background:rgba(204,255,0,.12)}
    .bg-slate-900{background:rgba(255,255,255,.07)!important}
  </style>
</head>
<body class="min-h-screen">
<div id="paddleBg" aria-hidden="true"></div>
<div class="max-w-2xl mx-auto w-full px-4 pt-5 pb-32">
  <div class="flex justify-between items-start gap-3">
    <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-neon-lime text-slate-950 font-black flex items-center justify-center font-display">PP</div><span class="text-sm font-display font-bold">PICKLE<span class="neon-lime">PRO</span></span></div>
    <div id="hs" class="text-[11px] font-mono text-slate-400 text-right"></div>
  </div>
  <h1 id="hn" class="font-display font-extrabold text-2xl sm:text-3xl mt-4 leading-tight"></h1>
  <p id="hv" class="text-xs text-slate-400 mt-1"></p>
  <div class="grid grid-cols-5 gap-2 mt-4 items-center">
    <label class="col-span-2 text-[11px] font-mono tracking-widest neon-lime">VIEW CATEGORY</label>
    <select id="cs" onchange="S.cat=this.value;render()" class="col-span-3 rounded-xl px-3 py-2 text-sm border"></select>
  </div>
  <div class="mt-4 flex gap-2">
    <input id="q" oninput="S.q=this.value.trim();render()" placeholder="Find my games: player or team name" class="flex-1 rounded-xl px-3 py-2 text-sm border">
  </div>
  <div id="view" class="mt-4"></div>
  <footer class="flex justify-center"><div class="powered"><small>Powered by</small><span class="fire-text">imachui<i class="ember" style="left:8%;--x:-6px"></i><i class="ember" style="left:35%;--x:8px;animation-delay:.4s"></i><i class="ember" style="left:62%;--x:-4px;animation-delay:.9s"></i><i class="ember" style="left:90%;--x:-8px;animation-delay:.7s"></i></span></div></footer>
</div>
<nav class="fixed bottom-0 inset-x-0 z-40 bg-slate-900 border-t border-slate-800 grid grid-cols-5 text-xs font-semibold px-2 py-2 gap-1" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))">
  <button data-t="courts" onclick="go('courts')">Courts</button><button data-t="matches" onclick="go('matches')">Matches</button><button data-t="stand" onclick="go('stand')">Standings</button><button data-t="medal" onclick="go('medal')">Medal</button><button data-t="setup" onclick="go('setup')">⚙ Setup</button>
</nav>
<div id="sm" style="display:none" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-md items-center justify-center p-4">
  <div class="glass-panel w-full max-w-md rounded-3xl p-5">
    <div class="flex justify-between text-[11px] font-mono text-slate-400 mb-3"><span id="sT"></span><button onclick="closeS()" class="text-lg leading-none">✕</button></div>
    <div class="grid grid-cols-2 gap-3 text-center">
      <div><div id="sNa" class="font-bold text-sm min-h-[2.5rem]"></div><div id="sA" class="font-display font-black text-6xl my-2">0</div><div class="flex gap-2"><button onclick="pt('a',-1)" class="flex-1 py-2 rounded-xl bg-slate-800">-1</button><button onclick="pt('a',1)" class="flex-[2] py-2 rounded-xl bg-emerald-500 text-slate-950 font-black">+1</button></div></div>
      <div><div id="sNb" class="font-bold text-sm min-h-[2.5rem]"></div><div id="sB" class="font-display font-black text-6xl my-2">0</div><div class="flex gap-2"><button onclick="pt('b',-1)" class="flex-1 py-2 rounded-xl bg-slate-800">-1</button><button onclick="pt('b',1)" class="flex-[2] py-2 rounded-xl bg-emerald-500 text-slate-950 font-black">+1</button></div></div>
    </div>
    <button id="sF" onclick="fin()" class="w-full mt-4 py-3 rounded-xl font-extrabold uppercase"></button>
  </div>
</div>
<script>
    // Premium paddle brand background (2026-2027)
    (function(){
      const B=[["SELKIRK","#ff5a5f","#7a0f1d"],["JOOLA","#22d3ee","#0b4f6c"],["CRBN","#a3e635","#14532d"],["ENGAGE","#fb923c","#7c2d12"],["PADDLETEK","#a78bfa","#3b1a7a"],["FRANKLIN","#60a5fa","#1e3a8a"],["GEARBOX","#f472b6","#831843"],["SIX ZERO","#facc15","#713f12"],["VATIC PRO","#34d399","#064e3b"],["PROKENNEX","#e879f9","#581c87"],["HEAD","#f87171","#450a0a"],["ONIX","#38bdf8","#0c4a6e"],["DIADEM","#fde047","#854d0e"],["RONBUS","#2dd4bf","#134e4a"]];
      const P=[[2,4],[16,58],[30,8],[44,62],[58,2],[72,52],[88,10],[8,30],[84,38],[38,34],[62,30],[22,80],[52,82],[92,72]];
      const bg=document.getElementById('paddleBg');
      let defs='<svg width="0" height="0" style="position:absolute"><defs><pattern id="holes" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.6" fill="rgba(0,0,0,.28)"/></pattern></defs></svg>';
      bg.innerHTML=defs+B.map((b,i)=>{
        const fs=Math.min(19,120/(b[0].length*.72)).toFixed(1),g='g'+i;
        return `<div class="paddle" style="left:${P[i][0]}%;top:${P[i][1]}%;--r:${(i*29%50)-25}deg;--d:${5+i%5}s;--dl:-${i}s">
        <svg viewBox="0 0 120 265"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${b[1]}"/><stop offset="1" stop-color="${b[2]}"/></linearGradient></defs>
        <rect x="52" y="150" width="16" height="104" rx="8" fill="#111827" stroke="rgba(255,255,255,.35)"/>
        <path d="M30 140 L90 140 L68 168 L52 168Z" fill="url(#${g})"/>
        <rect x="6" y="6" width="108" height="148" rx="50" fill="url(#${g})" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
        <rect x="6" y="6" width="108" height="148" rx="50" fill="url(#holes)"/>
        <rect x="14" y="14" width="92" height="132" rx="42" fill="none" stroke="rgba(255,255,255,.35)"/>
        <path d="M18 40 Q30 12 66 12" stroke="rgba(255,255,255,.6)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="60" y="82" transform="rotate(-90 60 80)" text-anchor="middle" dominant-baseline="middle" font-family="Chakra Petch,sans-serif" font-weight="800" font-size="${fs}" letter-spacing="2" fill="#fff" fill-opacity=".92">${b[0]}</text></svg></div>`}).join('');
    })();

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='picklepro-v2';
let S={name:'PicklePro Tournament',venue:'',date:'',courts:4,target:11,cats:[],matches:[],tab:'courts',cat:'all',q:'',n:0},cur=null;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S={...S,...x,q:''}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const go=t=>{S.tab=t;render()};
const win=m=>m.bye?(m.a||m.b):(m.sa>m.sb?m.a:m.b);
const lose=m=>m.bye?null:(m.sa>m.sb?m.b:m.a);
const ok=(a,b)=>a>=S.target&&a-b>=2;
const empty='<div class="bg-slate-900 rounded-2xl p-8 text-center text-sm text-slate-400">Nothing here yet. Go to ⚙ Setup to create a category and add teams.</div>';
const fm=()=>S.matches.filter(m=>(S.cat=='all'||m.cat==S.cat)&&(!S.q||((m.a||'')+' '+(m.b||'')).toLowerCase().includes(S.q.toLowerCase())));
const rdName=n=>n==1?'Final':n==2?'Semifinals':n==4?'Quarterfinals':'Round of '+n*2;

function table(c,pi){
  const r=c.pools[pi].map(t=>({t,mp:0,w:0,l:0,pf:0,pa:0}));
  S.matches.filter(m=>m.cat==c.id&&m.st=='pool'&&m.pl==pi&&m.state=='final').forEach(m=>{
    const A=r.find(x=>x.t==m.a),B=r.find(x=>x.t==m.b);A.mp++;B.mp++;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++}else{B.w++;A.l++}});
  return r.sort((x,y)=>y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf);
}
function mk(c,o){const no=S.matches.filter(m=>m.cat==c.id&&m.rd==o.rd).length+1;
  S.matches.push({id:'m'+(++S.n),cat:c.id,sa:0,sb:0,state:'sched',no,court:(S.n%S.courts)+1,...o});}
function adv(c){
  const pm=S.matches.filter(m=>m.cat==c.id&&m.st=='pool');
  if(!pm.length||!pm.every(m=>m.state=='final'))return;
  const km=S.matches.filter(m=>m.cat==c.id&&m.st=='ko');let pairs=[];
  if(!km.length){
    const q=c.pools.map((_,i)=>table(c,i).slice(0,c.adv).map(x=>x.t)),seeds=[];
    for(let k=0;k<c.adv;k++)q.forEach(p=>p[k]&&seeds.push(p[k]));
    if(seeds.length<2)return;
    let size=2;while(size<seeds.length)size*=2;
    const arr=[...seeds];while(arr.length<size)arr.push(null);
    for(let i=0;i<size/2;i++)pairs.push([arr[i],arr[size-1-i]]);
  }else{
    const last=Math.max(...km.map(m=>m.rn)),lm=km.filter(m=>m.rn==last);
    if(lm.length<2||!lm.every(m=>m.state=='final'))return;
    for(let i=0;i<lm.length;i+=2)pairs.push([win(lm[i]),win(lm[i+1])]);
  }
  const rn=km.length?Math.max(...km.map(m=>m.rn))+1:1;
  pairs.forEach(([a,b])=>mk(c,{st:'ko',rn,rd:rdName(pairs.length),a,b,...(!a||!b?{bye:true,state:'final'}:{})}));
  adv(c);
}
function mCard(m){
  const w=m.state=='final'?(m.bye?(m.a?'a':'b'):(m.sa>m.sb?'a':'b')):'';
  const row=(k,n,s)=>`<div class="flex justify-between items-center py-2 border-t border-slate-800 ${w==k?'neon-lime font-bold':''}"><span class="text-sm">${n?esc(n):'<i class="text-slate-500">BYE</i>'} ${w==k&&!m.bye?'🏆':''}</span><span class="font-display text-xl">${m.bye?'':s}</span></div>`;
  const lab=m.state=='final'?'FINAL':m.state=='live'?'<span class="text-emerald-400">● LIVE</span>':'SCHEDULED';
  return `<div class="bg-slate-900 rounded-2xl p-3 mb-3 border border-slate-800"><div class="flex justify-between text-[11px] font-mono text-slate-400"><span>MATCH ${m.no} · COURT ${m.court}</span><span>${lab}</span></div>${row('a',m.a,m.sa)}${row('b',m.b,m.sb)}${m.bye?'':`<button onclick="openS('${m.id}')" class="mt-2 w-full text-xs font-bold py-2 rounded-xl bg-neon-lime text-slate-950">${m.state=='final'?'Edit score':'⚡ Live Score'}</button>`}</div>`;
}
function grp(list){
  return S.cats.filter(c=>list.some(m=>m.cat==c.id)).map(c=>{
    const ms=list.filter(m=>m.cat==c.id),rds=[...new Set(ms.map(m=>m.rd))];
    return `<h2 class="font-display font-bold text-xl mt-5">${esc(c.name)}</h2>`+rds.map(r=>`<div class="text-xs font-mono neon-lime tracking-widest my-2">${esc(r).toUpperCase()}</div>`+ms.filter(m=>m.rd==r).map(mCard).join('')).join('');
  }).join('')||empty;
}
function vCourts(){
  let h=`<div class="flex justify-between items-end mb-2"><h2 class="font-display text-2xl font-bold">Courts</h2><span class="text-xs text-slate-400">${S.courts} courts</span></div>`;
  for(let k=1;k<=S.courts;k++){
    const live=S.matches.find(m=>m.court==k&&m.state=='live'),nx=S.matches.find(m=>m.court==k&&m.state=='sched'&&!m.bye);
    const cn=m=>esc(S.cats.find(c=>c.id==m.cat)?.name||'');
    h+=`<div class="bg-slate-900 rounded-2xl p-4 mb-3 border ${live?'border-lime-300/60':'border-slate-800'}"><div class="flex justify-between"><b class="font-display text-lg">Court ${k}</b><span class="text-[11px] font-mono ${live?'text-emerald-400':'text-slate-400'}">${live?'● IN PLAY':'AVAILABLE'}</span></div>`+
    (live?`<div class="text-[11px] text-slate-400 mt-1">${cn(live)} · ${esc(live.rd)}</div><div class="flex justify-between mt-2 text-sm"><span>${esc(live.a)}</span><b class="font-display text-xl neon-lime">${live.sa}</b></div><div class="flex justify-between text-sm"><span>${esc(live.b)}</span><b class="font-display text-xl neon-lime">${live.sb}</b></div><button onclick="openS('${live.id}')" class="mt-3 w-full text-xs font-bold py-2 rounded-xl bg-neon-lime text-slate-950">Update score</button>`
    :nx?`<div class="text-sm text-slate-300 mt-2">Up next: ${esc(nx.a)} vs ${esc(nx.b)}</div><button onclick="openS('${nx.id}')" class="mt-3 w-full text-xs font-bold py-2 rounded-xl bg-slate-800">Start match</button>`:`<div class="text-slate-400 mt-2">Open court</div>`)+`</div>`;
  }
  return h;
}
const vMatches=()=>grp(fm());
function vStand(){
  const qq=S.q.toLowerCase();
  return S.cats.filter(c=>S.cat=='all'||c.id==S.cat).map(c=>c.pools.map((p,i)=>{
    const t=table(c,i),done=S.matches.filter(m=>m.cat==c.id&&m.st=='pool'&&m.pl==i).every(m=>m.state=='final');
    return `<div class="bg-slate-900 rounded-2xl p-3 mb-4 border border-slate-800"><div class="text-[11px] font-mono neon-lime">${esc(c.name).toUpperCase()} · QUALIFYING</div><div class="font-display text-xl mb-2">${c.pools.length>1?'Bracket '+'ABCDEFGH'[i]:'Pool'}</div><div class="overflow-x-auto"><table class="w-full text-xs"><tr class="text-slate-400 text-left"><th>#</th><th>TEAM</th><th>MP</th><th>W</th><th>L</th><th>PF</th><th>PA</th></tr>`+
    t.map((r,k)=>({r,k})).filter(({r})=>!qq||r.t.toLowerCase().includes(qq)).map(({r,k})=>`<tr class="border-t border-slate-800 ${k<c.adv?'bg-lime-300/10':''}"><td class="py-2 pr-1">${k+1}</td><td>${esc(r.t)}${done&&k<c.adv?' <span class="text-[10px] neon-lime font-mono">QUALIFIED</span>':''}</td><td>${r.mp}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf}</td><td>${r.pa}</td></tr>`).join('')+`</table></div><div class="text-[10px] font-mono text-slate-500 mt-2">TOP ${c.adv} ADVANCE · TIEBREAK: WINS, THEN POINT DIFFERENTIAL</div></div>`;
  }).join('')).join('')||empty;
}
function medals(c){
  const k=S.matches.filter(m=>m.cat==c.id&&m.st=='ko');
  if(!k.length)return '<div class="text-xs text-slate-400 my-3">Medal rounds start once all qualifying matches are finished.</div>';
  const mx=Math.max(...k.map(m=>m.rn)),top=k.filter(m=>m.rn==mx),f=top.length==1&&top[0].state=='final'?top[0]:null;
  const sl=k.filter(m=>m.rd=='Semifinals'&&m.state=='final'&&!m.bye).map(lose);
  const box=(l,n,g)=>`<div class="rounded-2xl p-3 border ${g?'border-lime-300/60 bg-lime-300/10':'border-slate-800 bg-slate-900'}"><div class="text-[11px] font-mono text-slate-400">${l}</div><div class="font-bold text-sm mt-1">${n?(g?'🏆 ':'')+esc(n):'—'}</div></div>`;
  return `<div class="grid grid-cols-2 gap-3 my-3">${box('CHAMPION',f&&win(f),1)}${box('1ST RUNNER-UP',f&&lose(f))}${box('2ND RUNNER-UP',sl[0])}${box('3RD RUNNER-UP',sl[1])}</div>`;
}
function vMedal(){
  const cs=S.cats.filter(c=>S.cat=='all'||c.id==S.cat);
  return cs.map(c=>`<div class="text-xs font-mono neon-lime tracking-widest mt-4">MEDAL ROUNDS</div><h2 class="font-display font-bold text-2xl">${esc(c.name)}</h2>`+medals(c)+grp(fm().filter(m=>m.st=='ko'&&m.cat==c.id)).replace(empty,'')).join('')||empty;
}
function vSetup(){
  const i=(id,l,v,t='text')=>`<label class="block text-[11px] font-mono text-slate-400 mt-3 mb-1">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" class="w-full rounded-xl px-3 py-2 text-sm border">`;
  return `<div class="bg-slate-900 rounded-2xl p-4 mb-4 border border-slate-800"><h2 class="font-display font-bold text-lg">Event details</h2>${i('en','EVENT NAME',S.name)}${i('ev','VENUE',S.venue)}${i('ed','DATE',S.date)}${i('ec','NUMBER OF COURTS',S.courts,'number')}${i('et','POINTS TO WIN (win by 2)',S.target,'number')}<button onclick="saveEvt()" class="mt-4 w-full py-2.5 rounded-xl bg-slate-800 font-bold text-sm">Save event</button></div>
  <div class="bg-slate-900 rounded-2xl p-4 mb-4 border border-slate-800"><h2 class="font-display font-bold text-lg">Add category</h2>${i('cn','CATEGORY NAME','',"text")}<label class="block text-[11px] font-mono text-slate-400 mt-3 mb-1">TEAMS (1 per line)</label><textarea id="ct" rows="6" placeholder="Juan Dela Cruz &amp; Pedro Santos" class="w-full rounded-xl px-3 py-2 text-sm border"></textarea><div class="grid grid-cols-2 gap-3">${i('cp','QUALIFYING BRACKETS',2,'number')}${i('ca','TOP ADVANCE PER BRACKET',2,'number')}</div><button onclick="gen()" class="mt-4 w-full py-3 rounded-xl bg-neon-lime text-slate-950 font-extrabold font-display uppercase">⚡ Generate matches</button></div>
  <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800"><h2 class="font-display font-bold text-lg mb-2">Categories</h2>${S.cats.map(c=>`<div class="flex justify-between items-center py-2 border-t border-slate-800 text-sm"><span>${esc(c.name)}</span><button onclick="delCat('${c.id}')" class="text-rose-400 text-xs">Delete</button></div>`).join('')||'<div class="text-xs text-slate-400">None yet.</div>'}<button onclick="resetAll()" class="mt-3 w-full py-2 rounded-xl border border-rose-500/40 text-rose-400 text-xs font-bold">Reset everything</button></div>`;
}
function saveEvt(){S.name=$('en').value||'Tournament';S.venue=$('ev').value;S.date=$('ed').value;S.courts=Math.max(1,+$('ec').value||4);S.target=Math.max(1,+$('et').value||11);render();}
function gen(){
  const name=$('cn').value.trim(),teams=$('ct').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name||teams.length<2){alert('Enter a category name and at least 2 teams.');return}
  const np=Math.max(1,Math.min(+$('cp').value||1,Math.floor(teams.length/2))),adv=Math.max(1,+$('ca').value||2);
  const c={id:'c'+(++S.n),name,adv,pools:Array.from({length:np},()=>[])};
  teams.forEach((t,k)=>{const r=Math.floor(k/np),col=k%np;c.pools[r%2?np-1-col:col].push(t)});
  S.cats.push(c);
  c.pools.forEach((p,pi)=>{for(let x=0;x<p.length;x++)for(let y=x+1;y<p.length;y++)mk(c,{st:'pool',pl:pi,rd:np>1?'Bracket '+'ABCDEFGH'[pi]:'Pool',a:p[x],b:p[y]})});
  S.cat=c.id;S.tab='matches';render();
}
function delCat(id){if(confirm('Delete this category and all of its matches?')){S.cats=S.cats.filter(c=>c.id!=id);S.matches=S.matches.filter(m=>m.cat!=id);S.cat='all';render()}}
function resetAll(){if(confirm('Delete ALL data?')){localStorage.removeItem(KEY);location.reload()}}
function openS(id){cur=S.matches.find(m=>m.id==id);if(cur.state=='sched')cur.state='live';drawS();$('sm').style.display='flex';render();}
function closeS(){$('sm').style.display='none';cur=null}
function pt(t,d){if(!cur)return;cur['s'+t]=Math.max(0,cur['s'+t]+d);drawS();render();}
function drawS(){
  $('sT').textContent=`${S.cats.find(c=>c.id==cur.cat)?.name||''} · ${cur.rd} · COURT ${cur.court}`;
  $('sNa').textContent=cur.a;$('sNb').textContent=cur.b;$('sA').textContent=cur.sa;$('sB').textContent=cur.sb;
  const f=$('sF'),w=ok(cur.sa,cur.sb)||ok(cur.sb,cur.sa);
  f.disabled=!w;f.className='w-full mt-4 py-3 rounded-xl font-extrabold uppercase '+(w?'bg-emerald-400 text-slate-950':'bg-slate-800 text-slate-500');
  f.textContent=w?'✓ Confirm final score':`Playing to ${S.target}, win by 2`;
}
function fin(){if(!cur||!(ok(cur.sa,cur.sb)||ok(cur.sb,cur.sa)))return;cur.state='final';adv(S.cats.find(c=>c.id==cur.cat));closeS();render();}
function render(){
  $('hn').textContent=S.name;$('hv').textContent=[S.venue,S.date].filter(Boolean).join(' · ')||'Set your event details in ⚙ Setup';
  const real=S.matches.filter(m=>!m.bye),done=real.filter(m=>m.state=='final').length;
  $('hs').innerHTML=`<b class="neon-lime text-xl">${S.cats.length}</b> CATEGORIES<br><b class="neon-lime text-xl">${real.length?Math.round(done/real.length*100):0}%</b> PROGRESS`;
  $('cs').innerHTML='<option value="all">All categories</option>'+S.cats.map(c=>`<option value="${c.id}" ${S.cat==c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  $('view').innerHTML=({courts:vCourts,matches:vMatches,stand:vStand,medal:vMedal,setup:vSetup})[S.tab]();
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
  save();
}
render();
</script>
</body>
</html>
